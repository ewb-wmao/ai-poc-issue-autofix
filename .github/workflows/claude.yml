name: Claude Code

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # 触发条件：
    # 1. issue 被打上 ai-fix label
    # 2. 或者评论里 @claude
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'ai-fix') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.10"

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: "claude-sonnet-4-5"
          claude_args: |
            --allowed-tools "Bash,Edit,Write,Read,Glob,Grep,WebFetch"
          prompt: |
            You are fixing bugs in a Swift package called Calculator.
            Always follow the rules in CLAUDE.md.

            Your workflow MUST be:
            1. Read the issue carefully
            2. Locate the relevant code in Sources/Calculator/Calculator.swift
            3. Write a failing test in Tests/CalculatorTests/CalculatorTests.swift that reproduces the bug
            4. Fix the code in Calculator.swift
            5. Run `swift test` to verify all tests pass
            6. Create a new branch named `claude/issue-<number>`
            7. Commit your changes
            8. Push the branch
            9. Open a pull request that includes "Closes #<issue_number>" in the description

            Do not stop until the PR is created.